<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>像素相机</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #000; color: #fff;
            font-family: 'Courier New', monospace;
            height: 100dvh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden; touch-action: manipulation;
            user-select: none; -webkit-user-select: none;
        }
        #viewfinder {
            position: relative;
            width: 100vw; height: 100vw;
            max-width: 500px; max-height: 500px;
            background: #111; overflow: hidden;
            border: 2px solid #333;
            margin-bottom: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        video { display: none; }
        canvas {
            display: block; width: 100%; height: 100%;
            image-rendering: pixelated;
        }
        .placeholder {
            color: #555; font-size: 16px; text-align: center;
            pointer-events: none;
        }
        .controls {
            width: 100%; max-width: 500px;
            padding: 0 20px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .filter-row {
            display: flex; gap: 10px; justify-content: center; align-items: center;
        }
        .filter-arrow {
            width: 38px; height: 38px; padding: 0;
            border-radius: 50%; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            background: #2a2a2a; border: 1px solid #444;
            color: #ddd; cursor: pointer; font-weight: bold;
            transition: all 0.2s;
        }
        .filter-arrow:active { background: #3a3a3a; }
        .filter-label {
            display: inline-block;
            min-width: 80px;
            text-align: center;
            font-weight: bold;
            color: #d4af37;
            font-size: 15px;
            padding: 8px 16px;
            background: #1a1a1a;
            border-radius: 20px;
            border: 1px solid #444;
        }
        .slider-group {
            display: flex; align-items: center; gap: 10px;
            background: #1a1a1a; padding: 8px 14px;
            border-radius: 30px; border: 1px solid #333;
        }
        .slider-group label {
            font-size: 14px; color: #aaa; width: 55px;
        }
        input[type=range] {
            flex: 1; accent-color: #d4af37;
        }
        .slider-value {
            width: 36px; text-align: center; font-weight: bold;
            color: #d4af37; font-size: 16px;
        }
        .btn-row {
            display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
        }
        button {
            background: #2a2a2a; border: 1px solid #444;
            color: #ddd; padding: 10px 14px; border-radius: 25px;
            font-size: 14px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; white-space: nowrap;
        }
        button:active { background: #3a3a3a; }
        button.primary { background: #d4af37; color: #000; border-color: #d4af37; }
        button.recording { background: #c0392b; color: #fff; border-color: #c0392b; animation: pulse 1s infinite; }
        button.dv-active { background: #8e44ad; color: #fff; border-color: #8e44ad; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .warning {
            color: #ff7777; font-size: 13px; text-align: center;
            margin-top: 2px; padding: 0 20px;
        }
        .info {
            color: #888; font-size: 12px; text-align: center;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div id="viewfinder">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="outputCanvas"></canvas>
        <div class="placeholder" id="placeholder">上传照片 或 使用摄像头</div>
    </div>
    <div class="controls">
        <!-- 滤镜切换 -->
        <div class="filter-row">
            <button id="filterPrev" class="filter-arrow">◀</button>
            <span id="filterLabel" class="filter-label">原色</span>
            <button id="filterNext" class="filter-arrow">▶</button>
        </div>
        <!-- 像素尺寸 -->
        <div class="slider-group">
            <label>像素</label>
            <input type="range" id="pixelSize" min="2" max="40" value="8" step="1">
            <span class="slider-value" id="pixelValue">8</span>
        </div>
        <!-- 剪影阈值 -->
        <div class="slider-group" id="thresholdRow">
            <label>阈值</label>
            <input type="range" id="thresholdSlider" min="20" max="200" value="80" step="1">
            <span class="slider-value" id="thresholdValue">80</span>
        </div>
        <!-- 颜色深度 -->
        <div class="slider-group" id="colorDepthRow">
            <label>亮度</label>
            <input type="range" id="colorDepthSlider" min="50" max="255" value="220" step="1">
            <span class="slider-value" id="colorDepthValue">220</span>
        </div>
        <!-- 按钮行 -->
        <div class="btn-row">
            <button id="uploadBtn">上传</button>
            <button id="cameraBtn">拍照</button>
            <button id="switchCameraBtn">切换</button>
            <button id="freezeBtn">冻结</button>
            <button id="dvBtn">DV</button>
            <button id="recordBtn">录制</button>
            <button id="downloadBtn" class="primary">保存</button>
        </div>
        <div class="info">v2.84· 点击画面切换冻结</div>
        <div class="warning" id="warning"></div>
    </div>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <script>
        // ========== DOM 元素 ==========
        const video = document.getElementById('video');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const placeholder = document.getElementById('placeholder');
        const pixelSlider = document.getElementById('pixelSize');
        const pixelValue = document.getElementById('pixelValue');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdValue = document.getElementById('thresholdValue');
        const colorDepthSlider = document.getElementById('colorDepthSlider');
        const colorDepthValue = document.getElementById('colorDepthValue');
        const thresholdRow = document.getElementById('thresholdRow');
        const colorDepthRow = document.getElementById('colorDepthRow');
        const freezeBtn = document.getElementById('freezeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const recordBtn = document.getElementById('recordBtn');
        const dvBtn = document.getElementById('dvBtn');
        const switchCameraBtn = document.getElementById('switchCameraBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const fileInput = document.getElementById('fileInput');
        const warningEl = document.getElementById('warning');
        const filterPrev = document.getElementById('filterPrev');
        const filterNext = document.getElementById('filterNext');
        const filterLabel = document.getElementById('filterLabel');

        // ========== 滤镜列表 ==========
        const filterList = ['none', 'red', 'blue', 'bw'];
        const filterNames = { none: '原色', red: '红黑', blue: '蓝黑', bw: '黑白' };
        let currentFilterIndex = 0;

        // ========== 状态变量 ==========
        let stream = null;
        let animationId = null;
        let frozen = false;
        let frozenFrame = null;
        let currentPixelSize = 8;
        let currentFilter = 'none';
        let currentFacingMode = 'environment';
        let videoReady = false;
        let initAttempted = false;
        let thresholdValue_user = 80;
        let colorDepth = 220;
        let uploadedImage = null;
        let mode = 'camera';

        // ========== 录制状态（MediaRecorder） ==========
        let recording = false;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordingMimeType = 'video/webm';

        // ========== DV风格 ==========
        let dvStyleEnabled = false;
        dvBtn.addEventListener('click', () => {
            dvStyleEnabled = !dvStyleEnabled;
            dvBtn.classList.toggle('dv-active', dvStyleEnabled);
        });

        // ========== 圆点遮罩缓存 ==========
        let cachedMask = null;
        let cachedMaskBlockSize = 0;
        let cachedMaskSize = 0;

        // ========== 滑块事件 ==========
        thresholdSlider.addEventListener('input', () => {
            thresholdValue_user = parseInt(thresholdSlider.value);
            thresholdValue.textContent = thresholdValue_user;
        });
        colorDepthSlider.addEventListener('input', () => {
            colorDepth = parseInt(colorDepthSlider.value);
            colorDepthValue.textContent = colorDepth;
        });

        // ========== 滤镜切换 ==========
        function updateFilterUI() {
            filterLabel.textContent = filterNames[currentFilter];
            if (currentFilter === 'red' || currentFilter === 'blue') {
                thresholdRow.style.display = 'flex';
                colorDepthRow.style.display = 'flex';
            } else {
                thresholdRow.style.display = 'none';
                colorDepthRow.style.display = 'none';
            }
        }

        filterPrev.addEventListener('click', () => {
            currentFilterIndex = (currentFilterIndex - 1 + filterList.length) % filterList.length;
            currentFilter = filterList[currentFilterIndex];
            updateFilterUI();
            if (mode === 'upload' && uploadedImage) processImage();
        });

        filterNext.addEventListener('click', () => {
            currentFilterIndex = (currentFilterIndex + 1) % filterList.length;
            currentFilter = filterList[currentFilterIndex];
            updateFilterUI();
            if (mode === 'upload' && uploadedImage) processImage();
        });

        // ========== 摄像头清理 ==========
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            videoReady = false;
        }

        // ========== 切换到摄像头模式 ==========
        async function switchToCamera() {
            if (recording) stopRecording();
            stopCamera();
            mode = 'camera';
            uploadedImage = null;
            frozen = false;
            frozenFrame = null;
            freezeBtn.textContent = '冻结';
            canvas.style.display = 'none';
            placeholder.style.display = 'block';
            await initCamera();
        }

        // ========== 切换到上传模式 ==========
        function switchToUpload(img) {
            if (recording) stopRecording();
            stopCamera();
            mode = 'upload';
            uploadedImage = img;
            frozen = false;
            frozenFrame = null;
            freezeBtn.textContent = '冻结';
            videoReady = false;
            placeholder.style.display = 'none';
            canvas.style.display = 'block';
            processImage();
        }

        // ========== 启动摄像头 ==========
        async function initCamera() {
            stopCamera();
            initAttempted = false;
            frozen = false;
            frozenFrame = null;
            freezeBtn.textContent = '冻结';
            
            if (initAttempted) return;
            initAttempted = true;
            warningEl.textContent = '正在请求摄像头...';
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: 640, height: 640 },
                    audio: false
                });
                video.srcObject = stream;
                await video.play();
                
                video.addEventListener('loadedmetadata', () => {
                    videoReady = true;
                    setupCanvasAndStart();
                    warningEl.textContent = '';
                    switchCameraBtn.textContent = '切换';
                    placeholder.style.display = 'none';
                    canvas.style.display = 'block';
                });
                
                setTimeout(() => {
                    if (!videoReady && video.videoWidth > 0) {
                        videoReady = true;
                        setupCanvasAndStart();
                        warningEl.textContent = '';
                        placeholder.style.display = 'none';
                        canvas.style.display = 'block';
                    } else if (!videoReady) {
                        warningEl.textContent = '摄像头未能获取画面';
                    }
                }, 2000);
                
            } catch (err) {
                warningEl.textContent = '摄像头权限被拒绝';
                placeholder.textContent = '请使用上传照片功能';
                console.error('Camera error:', err);
            }
        }

        // ========== 切换摄像头 ==========
        switchCameraBtn.addEventListener('click', () => {
            if (mode === 'upload') return;
            currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });

        // ========== 上传照片按钮 ==========
        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => switchToUpload(img);
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        // ========== 相机按钮 ==========
        cameraBtn.addEventListener('click', switchToCamera);

        function setupCanvasAndStart() {
            const rawSize = Math.min(video.videoWidth, video.videoHeight) || 640;
            const size = Math.floor(rawSize / currentPixelSize) * currentPixelSize;
            canvas.width = size;
            canvas.height = size;
            cachedMask = null;
            cachedMaskBlockSize = 0;
            cachedMaskSize = 0;
            startPixelLoop();
        }

        // ========== 处理上传的图片 ==========
        function processImage() {
            if (!uploadedImage) return;
            
            const imgW = uploadedImage.width;
            const imgH = uploadedImage.height;
            const rawSize = Math.min(imgW, imgH);
            const size = Math.floor(rawSize / currentPixelSize) * currentPixelSize;
            
            canvas.width = size;
            canvas.height = size;
            
            cachedMask = null;
            cachedMaskBlockSize = 0;
            cachedMaskSize = 0;
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = size;
            tempCanvas.height = size;
            
            const sx = (imgW - size) / 2;
            const sy = (imgH - size) / 2;
            tempCtx.drawImage(uploadedImage, sx, sy, size, size, 0, 0, size, size);
            
            const imageData = tempCtx.getImageData(0, 0, size, size);
            pixelateData(imageData, size);
        }

        // ========== 滤镜函数 ==========
        function applyFilterToBlock(r, g, b) {
            switch (currentFilter) {
                case 'red': {
                    if (r >= thresholdValue_user) return [colorDepth, 15, 15];
                    else return [0, 0, 0];
                }
                case 'blue': {
                    if (b >= thresholdValue_user) return [15, 15, colorDepth];
                    else return [0, 0, 0];
                }
                case 'bw': {
                    const gray = 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    const contrast = gray < 128 ? 0 : 255;
                    return [contrast, contrast, contrast];
                }
                default:
                    return [r, g, b];
            }
        }

        // ========== DV复古特效 ==========
function applyVHSStyle() {
    const w = canvas.width;
    const h = canvas.height;
    const imageData = ctx.getImageData(0, 0, w, h);
    const data = imageData.data;

    const now = new Date();
    const dateStr = now.toLocaleDateString('zh-CN');
    const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const recBlink = (Math.floor(now.getTime() / 500) % 2 === 0);

    // 1. 扫描线：隔行变暗 (保留)
    for (let y = 0; y < h; y++) {
        if (y % 2 === 0) {
            for (let x = 0; x < w; x++) {
                const idx = (y * w + x) * 4;
                data[idx] = Math.max(0, data[idx] * 0.85);
                data[idx + 1] = Math.max(0, data[idx + 1] * 0.85);
                data[idx + 2] = Math.max(0, data[idx + 2] * 0.85);
            }
        }
    }

    // 2. 色差偏移和噪点已移除，画面更干净

    ctx.putImageData(imageData, 0, 0);

    // 3. 高光溢出（减轻版，阈值 220 + 透明度 0.5）
    const bloomCanvas = document.createElement('canvas');
    bloomCanvas.width = w;
    bloomCanvas.height = h;
    const bloomCtx = bloomCanvas.getContext('2d');
    bloomCtx.drawImage(canvas, 0, 0);
    const bloomData = bloomCtx.getImageData(0, 0, w, h);
    const bd = bloomData.data;
    for (let i = 0; i < bd.length; i += 4) {
        const gray = bd[i] * 0.299 + bd[i+1] * 0.587 + bd[i+2] * 0.114;
        if (gray < 220) bd[i+3] = 0;   // 阈值提高到 220
    }
    bloomCtx.putImageData(bloomData, 0, 0);
    const blurCanvas = document.createElement('canvas');
    blurCanvas.width = w / 8;    // 模糊画布缩小到 1/8
    blurCanvas.height = h / 8;
    const blurCtx = blurCanvas.getContext('2d');
    blurCtx.drawImage(bloomCanvas, 0, 0, w / 8, h / 8);
    ctx.globalAlpha = 0.5;       // 半透明叠加以免过曝
    ctx.drawImage(blurCanvas, 0, 0, w, h);
    ctx.globalAlpha = 1.0;

    // 4. 低像素柔焦 (保留)
    const softCanvas = document.createElement('canvas');
    softCanvas.width = w * 0.8;
    softCanvas.height = h * 0.8;
    const softCtx = softCanvas.getContext('2d');
    softCtx.drawImage(canvas, 0, 0, w * 0.8, h * 0.8);
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(softCanvas, 0, 0, w, h);

    // 5. OSD：时间戳和REC
    ctx.fillStyle = 'white';
    ctx.font = 'bold 14px monospace';
    ctx.shadowColor = 'black';
    ctx.shadowBlur = 2;
    const margin = 8;
    ctx.fillText(dateStr + ' ' + timeStr, margin, h - margin);
    ctx.font = 'bold 12px monospace';
    if (recBlink) {
        ctx.fillStyle = 'red';
        ctx.beginPath();
        ctx.arc(w - 20, margin + 6, 4, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.fillStyle = 'white';
    ctx.fillText('REC', w - 40, margin + 10);
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
}
        // ========== 通用像素化处理 ==========
        function pixelateData(imageData, size) {
            const data = imageData.data;
            const blockSize = currentPixelSize;
            
            const adjustedSize = Math.floor(size / blockSize) * blockSize;
            size = adjustedSize;
            
            canvas.width = size;
            canvas.height = size;
            
            const smallW = Math.floor(size / blockSize);
            const smallH = Math.floor(size / blockSize);
            
            const smallCanvas = document.createElement('canvas');
            smallCanvas.width = smallW;
            smallCanvas.height = smallH;
            const smallCtx = smallCanvas.getContext('2d');
            smallCtx.imageSmoothingEnabled = false;
            
            const smallImageData = smallCtx.createImageData(smallW, smallH);
            
            for (let y = 0; y < smallH; y++) {
                for (let x = 0; x < smallW; x++) {
                    let sumR = 0, sumG = 0, sumB = 0, count = 0;
                    const startX = x * blockSize;
                    const startY = y * blockSize;
                    const endX = Math.min(startX + blockSize, size);
                    const endY = Math.min(startY + blockSize, size);
                    
                    for (let sy = startY; sy < endY; sy++) {
                        for (let sx = startX; sx < endX; sx++) {
                            const idx = (sy * size + sx) * 4;
                            sumR += data[idx];
                            sumG += data[idx + 1];
                            sumB += data[idx + 2];
                            count++;
                        }
                    }
                    let avgR = Math.round(sumR / count);
                    let avgG = Math.round(sumG / count);
                    let avgB = Math.round(sumB / count);
                    
                    if (currentFilter === 'none') {
                        const rNorm = avgR / 255, gNorm = avgG / 255, bNorm = avgB / 255;
                        const max = Math.max(rNorm, gNorm, bNorm);
                        const min = Math.min(rNorm, gNorm, bNorm);
                        const l = (max + min) / 2;
                        let s = 0;
                        if (max !== min) {
                            s = l > 0.5 ? (max - min) / (2 - max - min) : (max - min) / (max + min);
                        }
                        s = Math.min(1, s * 1.8);
                        const contrastFactor = 1.50;
                        avgR = Math.min(255, Math.max(0, ((rNorm - 0.5) * contrastFactor + 0.5) * 255));
                        avgG = Math.min(255, Math.max(0, ((gNorm - 0.5) * contrastFactor + 0.5) * 255));
                        avgB = Math.min(255, Math.max(0, ((bNorm - 0.5) * contrastFactor + 0.5) * 255));
                        const gray = 0.299 * avgR + 0.587 * avgG + 0.114 * avgB;
                        avgR = Math.min(255, Math.max(0, gray + (avgR - gray) * 1.4));
                        avgG = Math.min(255, Math.max(0, gray + (avgG - gray) * 1.4));
                        avgB = Math.min(255, Math.max(0, gray + (avgB - gray) * 1.4));
                    }
                    
                    const [fr, fg, fb] = applyFilterToBlock(avgR, avgG, avgB);
                    
                    const smallIdx = (y * smallW + x) * 4;
                    smallImageData.data[smallIdx] = fr;
                    smallImageData.data[smallIdx + 1] = fg;
                    smallImageData.data[smallIdx + 2] = fb;
                    smallImageData.data[smallIdx + 3] = 255;
                }
            }
            smallCtx.putImageData(smallImageData, 0, 0);
            
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(smallCanvas, 0, 0, smallW, smallH, 0, 0, canvas.width, canvas.height);
            
            // 圆点遮罩（必须在DV之前）
            if (blockSize >= 4) {
                if (!cachedMask || cachedMaskBlockSize !== blockSize || cachedMaskSize !== canvas.width) {
                    const maskCanvas = document.createElement('canvas');
                    maskCanvas.width = canvas.width;
                    maskCanvas.height = canvas.height;
                    const maskCtx = maskCanvas.getContext('2d');
                    
                    maskCtx.fillStyle = '#000';
                    maskCtx.fillRect(0, 0, maskCanvas.width, maskCanvas.height);
                    
                    const radius = (blockSize / 2) * 0.85;
                    for (let y = 0; y < canvas.height; y += blockSize) {
                        for (let x = 0; x < canvas.width; x += blockSize) {
                            const centerX = x + blockSize / 2;
                            const centerY = y + blockSize / 2;
                            maskCtx.globalCompositeOperation = 'destination-out';
                            maskCtx.beginPath();
                            maskCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                            maskCtx.fill();
                        }
                    }
                    cachedMask = maskCanvas;
                    cachedMaskBlockSize = blockSize;
                    cachedMaskSize = canvas.width;
                }
                ctx.drawImage(cachedMask, 0, 0);
            }

            // DV风格：在最终画布上叠加特效
            if (dvStyleEnabled) {
                applyVHSStyle();
            }
        }

        // ========== 摄像头像素化 ==========
        function pixelateFrame() {
            if (!stream || !videoReady || video.readyState < 2) return;
            
            const vw = video.videoWidth || 640;
            const vh = video.videoHeight || 640;
            const rawSize = Math.min(vw, vh);
            const size = Math.floor(rawSize / currentPixelSize) * currentPixelSize;
            if (size === 0) return;
            
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = size;
            tempCanvas.height = size;
            
            const sx = (vw - size) / 2;
            const sy = (vh - size) / 2;
            tempCtx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
            
            const imageData = tempCtx.getImageData(0, 0, size, size);
            pixelateData(imageData, size);
        }

        // ========== 动画循环 ==========
        function startPixelLoop() {
            function loop() {
                if (mode !== 'camera') {
                    cancelAnimationFrame(animationId);
                    return;
                }
                if (!frozen) {
                    pixelateFrame();
                } else if (frozenFrame) {
                    ctx.putImageData(frozenFrame, 0, 0);
                }
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        // ========== 冻结/解冻 ==========
        function toggleFreeze() {
            if (frozen) {
                frozen = false;
                frozenFrame = null;
                freezeBtn.textContent = '冻结';
            } else {
                frozen = true;
                if (canvas.width > 0 && canvas.height > 0) {
                    frozenFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
                }
                freezeBtn.textContent = '解冻';
            }
        }

        freezeBtn.addEventListener('click', toggleFreeze);
        canvas.addEventListener('click', toggleFreeze);

        // ========== 录制（MediaRecorder） ==========
        function startRecording() {
            if (mode !== 'camera') return;
            recordedChunks = [];
            
            recordingMimeType = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                recordingMimeType = 'video/mp4';
            }
            
            const videoStream = canvas.captureStream(10);
            mediaRecorder = new MediaRecorder(videoStream, { mimeType: recordingMimeType });
            
            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) recordedChunks.push(e.data);
            };
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: recordingMimeType });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                const ext = (recordingMimeType === 'video/mp4') ? 'mp4' : 'webm';
                link.download = 'pixel_video.' + ext;
                link.href = url;
                link.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                recordedChunks = [];
            };
            
            mediaRecorder.start();
            recording = true;
            recordBtn.textContent = '停止';
            recordBtn.classList.add('recording');
        }

        function stopRecording() {
            if (!recording || !mediaRecorder) return;
            mediaRecorder.stop();
            recording = false;
            recordBtn.textContent = '录制';
            recordBtn.classList.remove('recording');
            mediaRecorder = null;
        }

        recordBtn.addEventListener('click', () => {
            if (!recording) startRecording();
            else stopRecording();
        });

        // ========== 保存下载（修复卡死和弹窗拦截） ==========
        downloadBtn.addEventListener('click', () => {
            if (canvas.width === 0) return;
            canvas.toBlob((blob) => {
                if (!blob) {
                    alert('图片生成失败，请重试');
                    return;
                }
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'pixel_photo.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, 'image/png');
        });

        // ========== 像素尺寸滑块 ==========
        pixelSlider.addEventListener('input', () => {
            currentPixelSize = parseInt(pixelSlider.value);
            pixelValue.textContent = currentPixelSize;
            cachedMask = null;
            cachedMaskBlockSize = 0;
            cachedMaskSize = 0;
            if (mode === 'upload' && uploadedImage) processImage();
        });

        // ========== 清理 ==========
        window.addEventListener('beforeunload', () => {
            stopCamera();
        });

        // 初始启动
        updateFilterUI();
        initCamera();
    </script>
</body>
</html>
