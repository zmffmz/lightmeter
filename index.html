<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>像素相机 · DV-301</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#1a1a1e; font-family:'Courier New', monospace; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:12px; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
        .dv-body { width:100%; max-width:360px; background:linear-gradient(180deg, #4e4e56 0%, #3e3e44 20%, #36363c 50%, #2e2e33 100%); border-radius:14px 14px 22px 22px; padding:16px 14px 18px; position:relative; box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 14px 36px rgba(0,0,0,0.55); }
        .dv-screw { position:absolute; width:7px; height:7px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #5a5a5a, #1a1a1a); box-shadow:inset 0 1px 2px rgba(0,0,0,0.7); z-index:2; }
        .dv-screw.tl { top:8px; left:10px; } .dv-screw.tr { top:8px; right:10px; } .dv-screw.bl { bottom:8px; left:10px; } .dv-screw.br { bottom:8px; right:10px; }
        .dv-top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; padding:0 6px; }
        .dv-model { font-size:9px; color:#777; letter-spacing:3px; font-family:Arial, sans-serif; font-weight:bold; }
        .dv-badge { font-size:7px; color:#555; letter-spacing:2px; font-family:Arial, sans-serif; border:1px solid #3a3a3a; padding:1px 6px; border-radius:2px; }
        .dv-viewfinder { background:#19191d; border-radius:8px; padding:6px; box-shadow:inset 0 4px 18px rgba(0,0,0,0.75), 0 1px 0 rgba(255,255,255,0.03); margin-bottom:8px; position:relative; }
        .dv-viewfinder-inner { position:relative; width:100%; aspect-ratio:1; background:#0a0a0d; border-radius:3px; overflow:hidden; box-shadow:inset 0 0 80px rgba(0,0,0,0.55); }
        video { display:none; }
        canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
        .placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#444; font-size:13px; pointer-events:none; z-index:1; }

        /* 扫描线 */
        .scanlines { position:absolute; inset:0; pointer-events:none; z-index:4; display:none;
            background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0,0,0,0.15) 1px, rgba(0,0,0,0.15) 2px); }
        .scanlines.active { display:block; }

        /* REC 灯 */
        .dv-rec-light { position:absolute; top:10px; right:10px; display:flex; align-items:center; gap:4px; z-index:5; pointer-events:none; }
        .dv-rec-dot { width:7px; height:7px; border-radius:50%; background:#c0392b; box-shadow:0 0 8px #c0392b; opacity:0; transition:opacity 0.2s; }
        .dv-rec-dot.active { opacity:1; animation:recPulse 0.9s infinite; }
        .dv-rec-text { font-size:7px; color:#ff5555; font-weight:bold; letter-spacing:2px; font-family:Arial, sans-serif; opacity:0; transition:opacity 0.2s; }
        .dv-rec-text.active { opacity:1; }
        @keyframes recPulse { 0%,100%{ opacity:1; } 50%{ opacity:0.12; } }

        /* 日期 */
        .dv-date { position:absolute; bottom:10px; left:10px; font-size:12px; color:#fff; font-family:'Courier New', monospace; font-weight:bold; text-shadow:0 0 4px #000; z-index:5; pointer-events:none; }

        .dv-zoom-row { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:8px; }
        .zoom-btn { width:44px; height:30px; border-radius:6px; border:none; cursor:pointer; font-size:16px; font-weight:bold; color:#ccc; background:linear-gradient(180deg, #585860 0%, #3c3c42 100%); box-shadow:0 3px 6px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07); transition:all 0.08s; display:flex; align-items:center; justify-content:center; font-family:Arial, sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
        .zoom-btn:active { box-shadow:0 1px 2px rgba(0,0,0,0.5), inset 0 2px 4px rgba(0,0,0,0.4); transform:translateY(2px); background:linear-gradient(180deg, #3c3c42 0%, #585860 100%); }
        .zoom-label { font-size:12px; color:#d4af37; font-weight:bold; min-width:60px; text-align:center; background:#1e1e24; padding:6px 10px; border-radius:12px; border:1px solid #35353a; }

        .dv-filter-row { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:8px; padding:0 20px; }
        .dv-filter-btn { width:36px; height:36px; border-radius:6px; border:none; cursor:pointer; font-size:16px; font-weight:bold; color:#ccc; background:linear-gradient(180deg, #585860 0%, #3c3c42 100%); box-shadow:0 3px 6px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07); transition:all 0.08s; display:flex; align-items:center; justify-content:center; font-family:Arial, sans-serif; }
        .dv-filter-btn:active { box-shadow:0 1px 2px rgba(0,0,0,0.5), inset 0 2px 4px rgba(0,0,0,0.4); transform:translateY(2px); background:linear-gradient(180deg, #3c3c42 0%, #585860 100%); }
        .dv-filter-name { font-size:13px; color:#d4af37; letter-spacing:3px; font-weight:bold; min-width:50px; text-align:center; padding:6px 14px; background:#1e1e24; border-radius:20px; border:1px solid #35353a; }
        .dv-btn-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin-bottom:8px; }
        .dv-btn { height:40px; border-radius:6px; border:none; cursor:pointer; font-family:'PingFang SC', 'Microsoft YaHei', Arial, sans-serif; font-size:13px; font-weight:bold; letter-spacing:1px; color:#ccc; background:linear-gradient(180deg, #585860 0%, #3c3c42 100%); box-shadow:0 3px 6px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07); transition:all 0.08s; display:flex; align-items:center; justify-content:center; }
        .dv-btn:active { box-shadow:0 1px 2px rgba(0,0,0,0.5), inset 0 2px 4px rgba(0,0,0,0.4); transform:translateY(2px); background:linear-gradient(180deg, #3c3c42 0%, #585860 100%); }
        .dv-btn.rec { background:linear-gradient(180deg, #d94040 0%, #a02020 100%); color:#fff; box-shadow:0 3px 8px rgba(192,57,43,0.5), inset 0 1px 0 rgba(255,255,255,0.15); letter-spacing:2px; }
        .dv-btn.rec:active { background:linear-gradient(180deg, #a02020 0%, #d94040 100%); box-shadow:0 1px 3px rgba(192,57,43,0.3), inset 0 2px 4px rgba(0,0,0,0.3); }
        .dv-btn.rec.recording { animation:recPulse 1s infinite; }
        .dv-btn.toggle { gap:5px; } .dv-btn.toggle .sw-dot { width:8px; height:4px; border-radius:2px; background:#555; transition:all 0.2s; }
        .dv-btn.toggle.active { background:linear-gradient(180deg, #6a3d80 0%, #4a2060 100%); color:#e0c0ff; box-shadow:0 3px 8px rgba(120,60,160,0.35); }
        .dv-btn.toggle.active .sw-dot { background:#c090ff; box-shadow:0 0 6px #c090ff; }

        .dv-bottom-row { display:flex; gap:8px; align-items:stretch; }
        .dv-grip { flex:1; height:28px; background:repeating-linear-gradient(90deg, #2a2a30 0px, #2a2a30 4px, #33333a 4px, #33333a 8px); border-radius:4px; border:1px solid #3a3a3e; opacity:0.45; }
        .flash-overlay { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:10; border-radius:3px; transition:opacity 0.08s; }
        .flash-overlay.fire { opacity:0.9; }
        input[type="file"] { display:none; }

        /* 隐藏底部文字，但保留 DOM 供 JS 使用 */
        .warning, .info { display:none; }
    </style>
</head>
<body>
    <div class="dv-body">
        <div class="dv-screw tl"></div><div class="dv-screw tr"></div>
        <div class="dv-screw bl"></div><div class="dv-screw br"></div>
        <div class="dv-top-bar">
            <span class="dv-model">PIXELCAM</span>
            <span class="dv-badge">DV-301</span>
        </div>
        <div class="dv-viewfinder">
            <div class="dv-viewfinder-inner">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="outputCanvas"></canvas>
                <div class="scanlines" id="scanlinesOverlay"></div>
                <div class="flash-overlay" id="flash"></div>
                <div class="placeholder" id="placeholder">按「拍照」启动</div>
                <div class="dv-rec-light">
                    <div class="dv-rec-dot" id="recDot"></div>
                    <span class="dv-rec-text" id="recText">REC</span>
                </div>
                <div class="dv-date" id="dateLabel">----</div>
            </div>
        </div>

        <div class="dv-zoom-row">
            <button class="zoom-btn" id="zoomW">◀W</button>
            <span class="zoom-label" id="zoomLabel">1.0x</span>
            <button class="zoom-btn" id="zoomT">T▶</button>
        </div>

        <div class="dv-filter-row">
            <button class="dv-filter-btn" id="filterPrev">◀</button>
            <span class="dv-filter-name" id="filterLabel">原色</span>
            <button class="dv-filter-btn" id="filterNext">▶</button>
        </div>
        <div class="dv-btn-grid">
            <button class="dv-btn" id="uploadBtn">上传</button>
            <button class="dv-btn" id="captureBtn">拍照</button>
            <button class="dv-btn" id="switchBtn">切换</button>
            <button class="dv-btn" id="freezeBtn">冻结</button>
            <button class="dv-btn toggle" id="dvBtn">DV<span class="sw-dot"></span></button>
            <button class="dv-btn rec" id="recordBtn">录制</button>
        </div>
        <div class="dv-bottom-row"><div class="dv-grip"></div></div>
    </div>
    <!-- 保留 DOM 但隐藏，供 JS 使用 -->
    <div class="warning" id="warning"></div>
    <div class="info">500×500 · 录制含同步录音 · 24fps</div>

    <input type="file" id="fileInput" accept="image/*">

    <script>
    (function() {
        // DOM 元素
        const video = document.getElementById('video');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const placeholder = document.getElementById('placeholder');
        const flash = document.getElementById('flash');
        const scanlinesOverlay = document.getElementById('scanlinesOverlay');
        const recDot = document.getElementById('recDot');
        const recText = document.getElementById('recText');
        const dateLabel = document.getElementById('dateLabel');
        const filterLabel = document.getElementById('filterLabel');
        const warningEl = document.getElementById('warning');
        const zoomLabel = document.getElementById('zoomLabel');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const captureBtn = document.getElementById('captureBtn');
        const switchBtn = document.getElementById('switchBtn');
        const freezeBtn = document.getElementById('freezeBtn');
        const dvBtn = document.getElementById('dvBtn');
        const recordBtn = document.getElementById('recordBtn');
        const filterPrev = document.getElementById('filterPrev');
        const filterNext = document.getElementById('filterNext');
        const zoomW = document.getElementById('zoomW');
        const zoomT = document.getElementById('zoomT');

        // 常量
        const FILTERS = ['none', 'red', 'blue', 'bw'];
        const FILTER_CN = { none:'原色', red:'红黑', blue:'蓝黑', bw:'黑白' };
        const TARGET_BLOCKS = 500;
        const BASE_BLOCK = 1;
        const MAX_ZOOM = 4;
        const ZOOM_SPEED = 1.2;

        let zoomLevel = 1;
        let currentFilter = 'none';
        let filterIdx = 0;
        let frozen = false, frozenFrame = null;
        let facingMode = 'environment';
        let videoReady = false;
        let thresholdVal = 80, colorDepth = 220;
        let uploadedImage = null;
        let mode = 'camera';
        let recording = false, mediaRecorder = null, recordedChunks = [];
        let dvEnabled = false;
        let audioStream = null;

        let stream = null;
        let animationId = null;
        let zoomDir = 0;
        let lastZoomTime = performance.now();

        const offCropCanvas = document.createElement('canvas');
        const offCropCtx = offCropCanvas.getContext('2d');
        const offBlockCanvas = document.createElement('canvas');
        const offBlockCtx = offBlockCanvas.getContext('2d');

        // 更新日期
        function updateDateHTML() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            dateLabel.textContent = `${y}-${m}-${d}`;
        }
        setInterval(updateDateHTML, 1000);
        updateDateHTML();

        // 变焦控制
        function updateZoomDisplay() {
            zoomLabel.textContent = zoomLevel.toFixed(1) + 'x';
        }
        function setZoomDirection(dir) {
            zoomDir = dir;
            lastZoomTime = performance.now();
        }
        function updateZoomByTime(now) {
            if (zoomDir === 0) return false;
            const dt = (now - lastZoomTime) / 1000;
            if (dt <= 0) return false;
            const delta = ZOOM_SPEED * dt * (zoomDir > 0 ? 1 : -1);
            let newZoom = zoomLevel + delta;
            newZoom = Math.max(1, Math.min(MAX_ZOOM, newZoom));
            if (newZoom !== zoomLevel) {
                zoomLevel = newZoom;
                updateZoomDisplay();
                if (mode === 'upload' && uploadedImage) processImage();
                lastZoomTime = now;
                return true;
            }
            return false;
        }
        zoomW.addEventListener('pointerdown', e => { e.preventDefault(); setZoomDirection(-1); });
        zoomT.addEventListener('pointerdown', e => { e.preventDefault(); setZoomDirection(1); });
        zoomW.addEventListener('pointerup', () => setZoomDirection(0));
        zoomT.addEventListener('pointerup', () => setZoomDirection(0));
        zoomW.addEventListener('pointerleave', () => setZoomDirection(0));
        zoomT.addEventListener('pointerleave', () => setZoomDirection(0));
        zoomW.addEventListener('pointercancel', () => setZoomDirection(0));
        zoomT.addEventListener('pointercancel', () => setZoomDirection(0));

        // 滤镜
        function updateFilterUI() {
            filterLabel.textContent = FILTER_CN[currentFilter];
        }
        function switchFilter(dir) {
            filterIdx = (filterIdx + dir + FILTERS.length) % FILTERS.length;
            currentFilter = FILTERS[filterIdx];
            updateFilterUI();
            if (mode === 'upload' && uploadedImage) processImage();
        }
        filterPrev.addEventListener('click', () => switchFilter(-1));
        filterNext.addEventListener('click', () => switchFilter(1));

        function applyFilter(r, g, b) {
            switch (currentFilter) {
                case 'red':   return (r >= thresholdVal) ? [colorDepth,15,15] : [0,0,0];
                case 'blue':  return (b >= thresholdVal) ? [15,15,colorDepth] : [0,0,0];
                case 'bw': {
                    const gray = 0.2126*r + 0.7152*g + 0.0722*b;
                    const v = gray < thresholdVal ? 0 : 255;
                    return [v,v,v];
                }
                default: {
                    let rn = r/255, gn = g/255, bn = b/255;
                    let mx = Math.max(rn,gn,bn), mn = Math.min(rn,gn,bn);
                    let l = (mx+mn)/2, s = 0;
                    if (mx !== mn) s = l>0.5 ? (mx-mn)/(2-mx-mn) : (mx-mn)/(mx+mn);
                    s = Math.min(1, s*1.8);
                    const cf = 1.5;
                    let rr = Math.min(255, Math.max(0, ((rn-0.5)*cf+0.5)*255));
                    let gg = Math.min(255, Math.max(0, ((gn-0.5)*cf+0.5)*255));
                    let bb = Math.min(255, Math.max(0, ((bn-0.5)*cf+0.5)*255));
                    let gray2 = 0.299*rr + 0.587*gg + 0.114*bb;
                    rr = Math.min(255, Math.max(0, gray2 + (rr-gray2)*1.4));
                    gg = Math.min(255, Math.max(0, gray2 + (gg-gray2)*1.4));
                    bb = Math.min(255, Math.max(0, gray2 + (bb-gray2)*1.4));
                    return [rr,gg,bb];
                }
            }
        }

        function applyDVEffect() {
            const w = canvas.width, h = canvas.height;
            const imgData = ctx.getImageData(0,0,w,h);
            const d = imgData.data;
            const offset = Math.max(2, Math.floor(BASE_BLOCK * 0.8));
            const temp = new Uint8ClampedArray(d);
            for (let y=0; y<h; y++) {
                for (let x=0; x<w; x++) {
                    const i = (y*w + x)*4;
                    d[i]     = temp[(y*w + Math.max(0, x-offset))*4];
                    d[i+2]   = temp[(y*w + Math.min(w-1, x+offset))*4 + 2];
                    d[i+1]   = temp[i+1];
                }
            }
            for (let i=0; i<d.length; i+=4) {
                if (Math.random()<0.04) {
                    const noise = Math.floor(Math.random()*80-40);
                    d[i]   = Math.min(255, Math.max(0, d[i]+noise));
                    d[i+1] = Math.min(255, Math.max(0, d[i+1]+noise));
                    d[i+2] = Math.min(255, Math.max(0, d[i+2]+noise));
                }
            }
            for (let i=0; i<d.length; i+=4) {
                let r = d[i]*0.8, g = d[i+1]*0.8, b = d[i+2]*0.8;
                const ct = 0.7;
                r = 128 + (r-128)*ct;
                g = 128 + (g-128)*ct;
                b = 128 + (b-128)*ct;
                d[i]   = Math.min(255, Math.max(0, r));
                d[i+1] = Math.min(255, Math.max(0, g));
                d[i+2] = Math.min(255, Math.max(0, b));
            }
            ctx.putImageData(imgData,0,0);
        }

        function processImageDataWithZoom(sourceCanvas, sourceCtx, sourceX, sourceY, sourceSize) {
            const cropSize = sourceSize / zoomLevel;
            const aSize = Math.ceil(cropSize);
            offCropCanvas.width = aSize;
            offCropCanvas.height = aSize;
            offCropCtx.clearRect(0, 0, aSize, aSize);
            offCropCtx.drawImage(
                sourceCanvas,
                sourceX + (sourceSize - cropSize) / 2,
                sourceY + (sourceSize - cropSize) / 2,
                cropSize, cropSize,
                0, 0, aSize, aSize
            );

            offBlockCanvas.width = TARGET_BLOCKS;
            offBlockCanvas.height = TARGET_BLOCKS;
            offBlockCtx.imageSmoothingEnabled = true;
            offBlockCtx.drawImage(offCropCanvas, 0, 0, aSize, aSize, 0, 0, TARGET_BLOCKS, TARGET_BLOCKS);

            const blocksData = offBlockCtx.getImageData(0, 0, TARGET_BLOCKS, TARGET_BLOCKS).data;
            const filteredData = ctx.createImageData(TARGET_BLOCKS, TARGET_BLOCKS);
            for (let i = 0; i < blocksData.length; i += 4) {
                const r = blocksData[i];
                const g = blocksData[i+1];
                const b = blocksData[i+2];
                const [fr, fg, fb] = applyFilter(r, g, b);
                filteredData.data[i]     = fr;
                filteredData.data[i+1]   = fg;
                filteredData.data[i+2]   = fb;
                filteredData.data[i+3]   = 255;
            }

            const blockDisplaySize = BASE_BLOCK / zoomLevel;
            const outputSize = Math.round(TARGET_BLOCKS * blockDisplaySize);
            canvas.width = outputSize;
            canvas.height = outputSize;
            ctx.clearRect(0, 0, outputSize, outputSize);
            ctx.imageSmoothingEnabled = false;

            const offTemp = document.createElement('canvas');
            offTemp.width = TARGET_BLOCKS;
            offTemp.height = TARGET_BLOCKS;
            const offTempCtx = offTemp.getContext('2d');
            offTempCtx.putImageData(filteredData, 0, 0);
            ctx.drawImage(offTemp, 0, 0, TARGET_BLOCKS, TARGET_BLOCKS, 0, 0, outputSize, outputSize);

            if (dvEnabled) applyDVEffect();
            scanlinesOverlay.classList.toggle('active', dvEnabled);
        }

        function pixelateFrame() {
            if (!stream || !videoReady || video.readyState < 2) return;
            const vw = video.videoWidth || 640;
            const vh = video.videoHeight || 640;
            const raw = Math.min(vw, vh);
            processImageDataWithZoom(video, null, 0, 0, raw);
        }

        function processImage() {
            if (!uploadedImage) return;
            const iw = uploadedImage.width, ih = uploadedImage.height;
            const raw = Math.min(iw, ih);
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = raw;
            tempCanvas.height = raw;
            const sx = (iw - raw) / 2, sy = (ih - raw) / 2;
            tempCtx.drawImage(uploadedImage, sx, sy, raw, raw, 0, 0, raw, raw);
            processImageDataWithZoom(tempCanvas, tempCtx, 0, 0, raw);
        }

        function startLoop() {
            function loop(now) {
                updateZoomByTime(now);
                if (mode !== 'camera') { animationId = null; return; }
                if (!frozen) pixelateFrame();
                else if (frozenFrame && canvas.width > 0) ctx.putImageData(frozenFrame, 0, 0);
                animationId = requestAnimationFrame(loop);
            }
            if (animationId) cancelAnimationFrame(animationId);
            requestAnimationFrame(loop);
        }

        function capturePhoto() {
            if (canvas.width === 0) return;
            flash.classList.add('fire');
            setTimeout(() => flash.classList.remove('fire'), 120);
            canvas.toBlob(blob => {
                if (!blob) return;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const now = new Date();
                const ts = [now.getFullYear(), pad(now.getMonth()+1), pad(now.getDate())].join('') + '_' +
                           [pad(now.getHours()), pad(now.getMinutes()), pad(now.getSeconds())].join('');
                a.download = 'DV301_' + ts + '.png';
                a.href = url; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, 'image/png');
        }
        function pad(n) { return String(n).padStart(2, '0'); }

        function switchToUpload(img) {
            if (recording) stopRecording();
            stopCamera();
            mode = 'upload';
            uploadedImage = img;
            frozen = false; frozenFrame = null; freezeBtn.textContent = '冻结';
            videoReady = false;
            placeholder.style.display = 'none';
            canvas.style.display = 'block';
            updateZoomDisplay();
            processImage();
        }

        function stopCamera() {
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
            videoReady = false;
        }

        function initCamera() {
            if (recording) stopRecording();
            stopCamera();
            frozen = false; frozenFrame = null; freezeBtn.textContent = '冻结';
            canvas.style.display = 'none'; placeholder.style.display = 'flex'; placeholder.textContent = '启动中…';
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode, width: 640, height: 640 },
                audio: false
            }).then(s => {
                stream = s;
                video.srcObject = stream;
                return video.play();
            }).then(() => {
                return new Promise(resolve => {
                    function onReady() { video.removeEventListener('loadedmetadata', onReady); resolve(); }
                    video.addEventListener('loadedmetadata', onReady);
                    setTimeout(() => { if (!videoReady && video.videoWidth > 0) resolve(); }, 2000);
                });
            }).then(() => {
                videoReady = true;
                const raw = Math.min(video.videoWidth, video.videoHeight) || 640;
                const blockDisplaySize = BASE_BLOCK / zoomLevel;
                canvas.width = Math.round(TARGET_BLOCKS * blockDisplaySize);
                canvas.height = canvas.width;
                startLoop();
                placeholder.style.display = 'none'; canvas.style.display = 'block';
            }).catch(err => {
                console.error(err);
                placeholder.textContent = '摄像头不可用，请使用上传';
            });
        }

        function switchToCamera() {
            if (recording) stopRecording();
            stopCamera();
            mode = 'camera'; uploadedImage = null; frozen = false; frozenFrame = null;
            freezeBtn.textContent = '冻结';
            canvas.style.display = 'none'; placeholder.style.display = 'flex';
            initCamera();
        }

        function toggleFreeze() {
            if (mode === 'upload') return;
            if (frozen) { frozen = false; frozenFrame = null; freezeBtn.textContent = '冻结'; }
            else { frozen = true; if (canvas.width > 0) frozenFrame = ctx.getImageData(0,0,canvas.width,canvas.height); freezeBtn.textContent = '解冻'; }
        }

        // ========== 录制（优先 MP4 格式，自动降级） ==========
        async function startRecording() {
            if (mode !== 'camera' || recording) return;
            recordedChunks = [];
            const canvasStream = canvas.captureStream(24);
            const combinedStream = new MediaStream();

            canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));

            let hasAudio = false;
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioStream.getAudioTracks().forEach(track => {
                    combinedStream.addTrack(track);
                    hasAudio = true;
                });
            } catch (e) {
                // 麦克风不可用，继续录制无声视频
            }

            // 优先选择 MP4 编码（H.264 + AAC），然后降级到 WebM
            const mimes = [
                'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
                'video/mp4;codecs=avc1.42E01E',
                'video/mp4',
                'video/webm;codecs=vp8,opus',
                'video/webm;codecs=vp9,opus',
                'video/webm'
            ];
            let mimeType = '';
            for (const m of mimes) {
                if (MediaRecorder.isTypeSupported(m)) { mimeType = m; break; }
            }
            if (!mimeType) {
                warningEl.textContent = '浏览器不支持录制功能';
                return;
            }

            try {
                mediaRecorder = new MediaRecorder(combinedStream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 2500000,
                    audioBitsPerSecond: hasAudio ? 128000 : 0
                });
            } catch (e) {
                warningEl.textContent = '无法创建录制器';
                return;
            }

            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                if (recordedChunks.length === 0) return;
                const blob = new Blob(recordedChunks, { type: mimeType });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const now = new Date();
                const ts = [now.getFullYear(), pad(now.getMonth()+1), pad(now.getDate())].join('') + '_' +
                           [pad(now.getHours()), pad(now.getMinutes()), pad(now.getSeconds())].join('');
                const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                a.download = 'DV301_' + ts + '.' + ext;
                a.href = url; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                recordedChunks = [];
                if (audioStream) {
                    audioStream.getTracks().forEach(t => t.stop());
                    audioStream = null;
                }
            };
            mediaRecorder.start();
            recording = true;
            recordBtn.textContent = '停止'; recordBtn.classList.add('recording');
            recDot.classList.add('active'); recText.classList.add('active');
        }

        function stopRecording() {
            if (!recording || !mediaRecorder) return;
            try { mediaRecorder.stop(); } catch (e) {}
            recording = false;
            recordBtn.textContent = '录制'; recordBtn.classList.remove('recording');
            recDot.classList.remove('active'); recText.classList.remove('active');
            mediaRecorder = null;
        }

        uploadBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', e => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                const img = new Image();
                img.onload = () => switchToUpload(img);
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
            fileInput.value = '';
        });
        captureBtn.addEventListener('click', () => {
            if (mode === 'camera' && !videoReady) { initCamera(); return; }
            capturePhoto();
        });
        switchBtn.addEventListener('click', () => {
            if (mode === 'upload') return;
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        });
        freezeBtn.addEventListener('click', toggleFreeze);
        canvas.addEventListener('click', toggleFreeze);
        dvBtn.addEventListener('click', () => {
            dvEnabled = !dvEnabled;
            dvBtn.classList.toggle('active', dvEnabled);
            if (mode === 'upload' && uploadedImage) processImage();
        });
        recordBtn.addEventListener('click', () => {
            if (!recording) startRecording(); else stopRecording();
        });

        updateFilterUI();
        updateZoomDisplay();
        initCamera();
    })();
    </script>
</body>
</html>
