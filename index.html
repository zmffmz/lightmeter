<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141417">
<title>像素相机 · DV-301</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' 
fill='%23222226'/%3E%3Crect x='6' y='9' width='20' height='14' rx='3' fill='%23e9b44c'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23222226'/%3E%3C/svg%3E">
<style>
:root{
    --ink:#e9e7e2;
    --amber:#e9b44c;
    --amber-soft:rgba(233,180,76,.9);
    --line:rgba(255,255,255,.075);
    --etch:#777783;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{
    background:radial-gradient(120% 80% at 50% -10%, #26262c 0%, #141417 48%, #0b0b0d 100%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,'PingFang SC','Microsoft YaHei',sans-serif;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px 14px calc(16px 
+ env(safe-area-inset-bottom));
    gap:10px;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
    overflow-x:hidden;
}

/* ================= 机身 ================= */
.dv{
    width:100%;max-width:372px;position:relative;
    background:linear-gradient(180deg,#57575f 0%,#3d3d44 15%,#333339 52%,#29292e 100%);
    border-radius:20px 20px 26px 
26px;
    padding:13px 12px 15px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -1px 0 rgba(0,0,0,.6),
        0 26px 54px -12px rgba(0,0,0,.85),
        0 2px 0 rgba(255,255,255,.03);
}
/* 侧边磨砂握把 */
.dv::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
    
background:
        repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px) left center/6px 62% no-repeat,
        repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px) right center/6px 62% no-repeat;
    opacity:.7;
}
.dv::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    
background:linear-gradient(105deg,rgba(255,255,255,.07) 0%,transparent 26%,transparent 74%,rgba(255,255,255,.03) 100%);
}
.screw{
    position:absolute;width:6px;height:6px;border-radius:50%;z-index:3;
    background:radial-gradient(circle at 35% 30%,#6a6a72,#191919 72%);
    box-shadow:inset 0 1px 1px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.06);
}
.screw.tl{top:9px;left:10px} .screw.br{bottom:9px;right:10px}

.dv-head{display:flex;align-items:center;justify-content:space-between;padding:0 3px 8px;position:relative;z-index:2}
.brand{font:700 10px/1 'Arial Narrow',Arial,sans-serif;letter-spacing:.34em;color:#d2d2da}
.brand em{font-style:normal;color:var(--amber)}
.model{font:700 9px/1 Arial,sans-serif;letter-spacing:.22em;color:#71717a;margin-left:auto;margin-right:9px}
.pwr{width:5px;height:5px;border-radius:50%;background:#6ee27a;box-shadow:0 0 7px #4fd45e;opacity:.9}

/* ================= 取景器 ================= */
.lcd{
    position:relative;background:#0a0a0c;border-radius:9px;padding:5px;margin-bottom:10px;z-index:2;
    box-shadow:0 0 0 1px #16161a, inset 0 2px 14px rgba(0,0,0,.95), 0 1px 0 rgba(255,255,255,.055);
    transition:box-shadow 
.25s;
}
.lcd.rec{box-shadow:0 0 0 1px #16161a, inset 0 2px 14px rgba(0,0,0,.95), 0 0 0 2px rgba(226,73,61,.55), 0 0 18px rgba(226,73,61,.2)}
.lcd-inner{
    position:relative;aspect-ratio:4/3;border-radius:4px;overflow:hidden;background:#050506;
    touch-action:none;cursor:grab;
}
#screen{display:block;width:100%;height:100%;image-rendering:pixelated}
.lcd-glare{
    position:absolute;inset:5px;border-radius:4px;pointer-events:none;z-index:6;
    background:linear-gradient(118deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.025) 16%,transparent 34%,transparent 100%);
    mix-blend-mode:screen;
}

.osd{position:absolute;inset:0;pointer-events:none;z-index:5;font-family:'Courier New',monospace}
.osd-rec{
    
position:absolute;top:8px;left:9px;display:flex;align-items:center;gap:5px;
    font-size:9px;font-weight:700;letter-spacing:1.5px;color:#ff5a4d;
    text-shadow:0 0 6px rgba(0,0,0,.9);opacity:0;transition:opacity .18s;
}
.osd-rec.on{opacity:1}
.osd-rec i{width:6px;height:6px;border-radius:50%;background:#ff4b3e;box-shadow:0 0 8px #ff4b3e;animation:pulse 1s infinite}
@keyframes 
pulse{0%,100%{opacity:1}50%{opacity:.15}}
.osd-info{
    position:absolute;top:8px;right:9px;display:flex;align-items:center;gap:6px;
    font-size:9px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.82);
    text-shadow:0 0 5px rgba(0,0,0,.95);
}
.osd-info span{background:rgba(0,0,0,.28);padding:1px 5px;border-radius:2px}
.osd-mode{
    position:absolute;bottom:7px;right:9px;font-size:8px;font-weight:700;letter-spacing:1.6px;
    color:rgba(255,255,255,.72);text-shadow:0 0 5px rgba(0,0,0,.95);
    background:rgba(0,0,0,.26);padding:1px 5px;border-radius:2px;
}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
.flash.go{animation:flashHit .3s ease-out}
@keyframes 
flashHit{0%{opacity:.92}100%{opacity:0}}

/* 空状态 */
.empty{
    position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:9px;padding:16px;text-align:center;
    background:radial-gradient(circle at 50% 45%,#131317,#08080a 70%);
}
.empty svg{width:28px;height:28px;color:#4a4a55;stroke-width:1.4}
.empty.loading 
svg{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.85}}
.empty p{font-size:11.5px;line-height:1.6;color:#8a8a95;max-width:225px}
.empty-actions{display:flex;gap:8px;margin-top:2px}
.empty-actions[hidden]{display:none}

/* ================= 通用小按钮 ================= */
.mini{
    border:1px solid 
var(--line);background:rgba(255,255,255,.055);color:#c9c9d2;
    padding:6px 13px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:.14s;
}
.mini:active{transform:translateY(1px);background:rgba(255,255,255,.1)}

/* ================= 控制面板 ================= */
.deck{
    position:relative;z-index:2;
    
display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding:9px 10px 8px;margin-bottom:13px;border-radius:12px;
    background:linear-gradient(180deg,#232329 0%,#1b1b20 55%,#202026 100%);
    box-shadow:
        inset 0 2px 7px rgba(0,0,0,.8),
        inset 0 -1px 0 rgba(255,255,255,.06),
        0 1px 0 rgba(255,255,255,.08);
}
.mod{
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:6px;height:90px;
}
.etched{
    font-size:8px;letter-spacing:.15em;color:var(--etch);
    text-shadow:0 1px 0 rgba(0,0,0,.8);
}
.etched b{color:#cfcfd9;font-weight:700;letter-spacing:.04em}

/* --- 胶片滚轮 --- */
.drum{
    position:relative;width:112px;height:74px;border-radius:9px;overflow:hidden;
    background:linear-gradient(180deg,#0c0c10,#15151a);
    box-shadow:inset 0 3px 9px rgba(0,0,0,.95),inset 0 -1px 0 rgba(255,255,255,.05),0 1px 0 rgba(255,255,255,.05);
    touch-action:none;cursor:grab;
}
.drum-track{position:absolute;left:0;top:0;width:100%;will-change:transform}
.drum-item{
    display:block;width:100%;height:24px;line-height:24px;text-align:center;
    border:none;background:none;font-family:inherit;font-size:11px;font-weight:700;
    letter-spacing:.12em;color:#4c4c57;cursor:pointer;transition:color .15s;
}
.drum-item.on{color:#ffd88f;text-shadow:0 0 12px rgba(233,180,76,.55)}
.drum-item.ghost{cursor:default}
.drum-win{
    position:absolute;left:4px;right:4px;top:24px;height:24px;border-radius:5px;pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(233,180,76,.28),inset 0 0 14px rgba(233,180,76,.10);
}
.drum-shade{
    
position:absolute;inset:0;pointer-events:none;border-radius:9px;
    background:linear-gradient(180deg,rgba(9,9,12,.92) 0%,rgba(9,9,12,0) 32%,rgba(9,9,12,0) 68%,rgba(9,9,12,.92) 100%);
}

/* --- 变焦摇杆 --- */
.rocker{
    position:relative;width:58px;height:74px;border-radius:12px;padding:3px;
    background:linear-gradient(180deg,#17171c,#0e0e12);
    box-shadow:inset 0 2px 6px 
rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06);
    display:flex;flex-direction:column;gap:2px;
    transition:transform .1s ease;
}
.rocker.tilt-t{transform:perspective(90px) rotateX(5deg)}
.rocker.tilt-w{transform:perspective(90px) rotateX(-5deg)}
.rock-half{
    flex:1;border:none;cursor:pointer;font-family:'Arial Narrow',Arial,sans-serif;
    
font-size:11px;font-weight:800;letter-spacing:.08em;color:#9c9caa;
    background:linear-gradient(180deg,#4c4c57,#33333b);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 3px rgba(0,0,0,.55),0 2px 0 #0d0d10;
    transition:.07s;display:flex;align-items:center;justify-content:center;
    touch-action:none;
}
.rock-half.t{border-radius:10px 10px 3px 3px}
.rock-half.w{border-radius:3px 
3px 10px 10px}
.rock-half.pressed{
    color:#ffd88f;
    background:linear-gradient(180deg,#33333b,#4c4c57);
    box-shadow:inset 0 2px 6px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.05);
}

/* --- CRT 竖长方形按键（自锁式，开启时按下去并亮灯） --- */
.toggle{
    position:relative;width:36px;height:74px;border-radius:9px;border:none;cursor:pointer;padding:0;
    background:linear-gradient(180deg,#53535d 0%,#3b3b44 58%,#2d2d34 100%);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -2px 3px rgba(0,0,0,.5),
        0 3px 0 #101014,
        0 6px 10px rgba(0,0,0,.45);
    transition:transform .08s ease,box-shadow .08s ease,background .18s;
    touch-action:manipulation;
}
.toggle::after{
    
content:"";position:absolute;left:9px;right:9px;bottom:11px;height:15px;border-radius:2px;
    background:repeating-linear-gradient(180deg,rgba(255,255,255,.11) 0 1px,transparent 1px 4px);
    pointer-events:none;
}
.toggle .led{
    position:absolute;left:50%;top:11px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#3d3d45,#1a1a20);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 1px 0 
rgba(255,255,255,.07);
    transition:.18s;
}
.toggle[aria-checked="true"]{
    transform:translateY(3px);
    background:linear-gradient(180deg,#45503f 0%,#373d33 58%,#2b2f28 100%);
    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.6),
        inset 0 -1px 0 rgba(255,255,255,.07),
        0 0 0 #101014,
        0 2px 5px rgba(0,0,0,.42);
}
.toggle[aria-checked="true"] .led{
    
background:radial-gradient(circle at 40% 35%,#eaffea,#6ee27a 52%,#2f9c3c);
    box-shadow:0 0 9px rgba(110,226,122,.85),0 0 2px rgba(255,255,255,.9);
}
.toggle:active{transform:translateY(5px)}

/* --- 侧边小键堆 --- */
.stack{display:flex;flex-direction:column;gap:8px}
.key{
    
width:44px;height:33px;border-radius:8px;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:linear-gradient(180deg,#4f4f59,#33333b);color:#b9b9c5;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 3px rgba(0,0,0,.5),0 3px 0 #101014,0 5px 8px rgba(0,0,0,.4);
    transition:.07s;font-family:inherit;
}
.key 
svg{display:block;width:12px;height:12px;stroke-width:1.9}
.key i{font-style:normal;font-size:7px;letter-spacing:.08em;color:#8b8b97;line-height:1}
.key:active{
    transform:translateY(3px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 2px 5px rgba(0,0,0,.6),0 1px 0 #101014,0 2px 4px rgba(0,0,0,.4);
}
.key:disabled{opacity:.35;pointer-events:none}

/* ================= 圆形按键 ================= */
.pad{display:flex;align-items:flex-start;justify-content:center;gap:28px;position:relative;z-index:2}
.col{display:flex;flex-direction:column;align-items:center;gap:7px}
.cap{font-size:8px;letter-spacing:.14em;color:#7e7e8a;text-shadow:0 1px 0 rgba(0,0,0,.75)}

.dial{
    position:relative;border:none;border-radius:50%;cursor:pointer;font-family:inherit;
    
display:flex;align-items:center;justify-content:center;color:#dcdce6;
    background:radial-gradient(circle at 36% 28%,#7a7a85 0%,#4f4f59 42%,#2c2c33 100%);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.2),
        inset 0 -3px 7px rgba(0,0,0,.55),
        0 5px 0 #141418,
        0 9px 16px rgba(0,0,0,.55);
    transition:transform .07s ease,box-shadow .07s ease;
    touch-action:manipulation;
}
.dial::before{
    content:"";position:absolute;inset:5px;border-radius:50%;pointer-events:none;
    background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0deg 2.5deg,rgba(0,0,0,.06) 2.5deg 5deg);
    -webkit-mask:radial-gradient(circle,transparent 50%,#000 72%);
            mask:radial-gradient(circle,transparent 50%,#000 72%);
}
.dial.m{width:56px;height:56px}
.dial.xl{width:68px;height:68px}
.dial:active{
    transform:translateY(4px);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.12),
        inset 0 -2px 5px rgba(0,0,0,.6),
        0 1px 0 #141418,
        0 3px 8px rgba(0,0,0,.5);
}
.dial svg{width:16px;height:16px;stroke-width:1.9;position:relative;z-index:1}

.dial.shutter{
    background:radial-gradient(circle at 36% 
28%,#fdfbf3 0%,#ded8c7 45%,#a9a18f 100%);color:#2a2822;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.95),
        inset 0 -3px 7px rgba(0,0,0,.22),
        0 5px 0 #6d6657,
        0 9px 16px rgba(0,0,0,.55);
}
.dial.shutter:active{
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 5px rgba(0,0,0,.28),0 1px 0 #6d6657,0 3px 8px rgba(0,0,0,.5);
}
.dial.shutter .ring{
    
width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(40,36,28,.35);
    box-shadow:0 1px 0 rgba(255,255,255,.7);position:relative;z-index:1;
}

.dial.rec{
    background:radial-gradient(circle at 36% 28%,#f2685c 0%,#ca382e 45%,#8c1e17 100%);color:#fff;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.32),
        inset 0 -3px 7px rgba(0,0,0,.45),
        0 5px 0 
#5d1310,
        0 9px 16px rgba(0,0,0,.55);
}
.dial.rec:active{
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 5px rgba(0,0,0,.5),0 1px 0 #5d1310,0 3px 8px rgba(0,0,0,.5);
}
.rec-dot{
    width:16px;height:16px;border-radius:50%;background:#fff;position:relative;z-index:1;
    box-shadow:0 0 10px rgba(255,255,255,.55);
    transition:border-radius .16s cubic-bezier(.3,1.4,.5,1),transform 
.16s;
}
.dial.rec.on .rec-dot{border-radius:2px;transform:scale(.78)}
.dial.rec.on{animation:recGlow 1.15s ease-in-out infinite}
@keyframes recGlow{
    0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -3px 7px rgba(0,0,0,.45),0 5px 0 #5d1310,0 9px 16px rgba(0,0,0,.55),0 0 0 0 rgba(226,73,61,.45)}
    50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -3px 7px rgba(0,0,0,.45),0 5px 0 #5d1310,0 9px 16px rgba(0,0,0,.55),0 0 0 7px 
rgba(226,73,61,0)}
}
.dial:disabled{opacity:.35;pointer-events:none}

.hint{font-size:9.5px;color:#6e6e7a;letter-spacing:.35px;text-align:center;padding:0 8px;line-height:1.7}
input[type=file]{display:none}
video#video{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}

/* ================= Toast ================= */
.toast{
    
position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:rgba(22,22,26,.94);border:1px solid rgba(255,255,255,.1);color:#e6e6ee;
    font-size:11.5px;padding:9px 16px;border-radius:999px;z-index:200;
    opacity:0;pointer-events:none;transition:.22s cubic-bezier(.2,.9,.3,1);
    box-shadow:0 10px 26px rgba(0,0,0,.55);white-space:nowrap;max-width:92vw;
    
overflow:hidden;text-overflow:ellipsis;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:359px){
    .dv{padding:11px 9px 13px}
    .deck{gap:6px;padding:8px 7px 7px}
    .drum{width:96px}
    .rocker{width:52px}
    .pad{gap:20px}
    .dial.xl{width:62px;height:62px}
    .dial.m{width:52px;height:52px}
}
@media 
(prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.001s!important}
}
</style>
</head>
<body>

<div class="dv" id="dv">
    <div class="screw tl"></div><div class="screw br"></div>

    <div class="dv-head">
        <span class="brand">PIXEL<em>CAM</em></span>
        <span 
class="model">DV-301</span>
        <span class="pwr"></span>
    </div>

    <div class="lcd" id="lcdWrap">
        <div class="lcd-inner" id="lcdInner">
            <canvas id="screen"></canvas>
            <div class="osd">
                <div class="osd-rec" id="osdRec"><i></i>REC <span id="osdRecTime">00:00</span></div>
                <div class="osd-info"><span id="osdZoom">W 1.0x</span></div>
                <div class="osd-mode" 
id="osdMode">CAM</div>
                <div class="flash" id="flashEl"></div>
            </div>
            <div class="empty loading" id="empty">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7l1.2-1.7A1.5 1.5 0 0 1 9.6 3.6h4.8c.5 0 .9.25 1.2.7L16.8 6h1.7A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/>
                    <circle cx="12" cy="13" 
r="3.6"/>
                </svg>
                <p id="emptyMsg">正在开启摄像头…</p>
                <div class="empty-actions" id="emptyActions" hidden>
                    <button class="mini" id="retryBtn">重试</button>
                    <button class="mini" id="emptyUploadBtn">上传照片</button>
                </div>
            </div>
        </div>
        <div class="lcd-glare"></div>
    </div>

    <!-- ======== 控制面板 ======== -->
    <div class="deck">

        <div class="mod">
            <div class="drum" id="filterDrum" role="listbox" aria-label="胶片模拟">
                <div class="drum-track" id="drumTrack"></div>
                <div class="drum-win"></div>
                <div class="drum-shade"></div>
            </div>
            <span class="etched">胶片 <b 
id="stockNum">1/8</b></span>
        </div>

        <div class="stack">
            <button class="key" id="flipBtn" aria-label="切换摄像头">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9.5h13.5l-3.2-3.2M20 14.5H6.5l3.2 3.2"/>
                </svg><i id="flipLabel">翻转</i>
            </button>
            <button class="key" 
id="pixBtn" aria-label="像素档位">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="14.5" y="3.5" width="6" height="6" rx="1"/>
                    <rect x="3.5" y="14.5" width="6" height="6" rx="1"/><rect x="14.5" y="14.5" width="6" height="6" rx="1"/>
                </svg><i id="pixLabel">中</i>
            </button>
        
</div>

/* 把一种片基烘焙成查找表，之后逐像素只做三次查表 */
const lutCache = new Map();
function stockLut(st){
    let lut = lutCache.get(st.key);
    if (lut) return lut;
    lut = new Uint8ClampedArray(768);
    for (let ch = 0; ch < 3; ch++){
        const blk = st.black[ch], wht = st.white[ch];
        const gam = st.gamma[ch], sh = st.shadow[ch], hi = st.high[ch];
        const inv = 1 / (wht - blk);
        for (let i = 0; i < 256; 
i++){
            let x = (i / 255 - blk) * inv;
            if (x < 0) x = 0; else if (x > 1) x = 1;
            if (st.contrast > 0){
                const s = x * x * (3 - 2 * x);
                x += (s - x) * st.contrast;
            }
            if (gam !== 1) x = Math.pow(x, gam);
            if (sh || hi){
                const k = 1 - x;
                x += sh * k * k * k + hi * x * x * x;
                if (x < 0) x = 0; else if (x > 1) x = 1;
            }
            // 
高光肩部：接近白点的地方柔化滚降，避免数码式的硬切
            if (st.shoulder !== false && x > 0.86){
                const t = (x - 0.86) / 0.14;
                x = 0.86 + 0.14 * (1 - (1 - t) * (1 - t));
            }
            lut[ch * 256 + i] = x * 255;
        }
    }
    lutCache.set(st.key, lut);
    return lut;
}

}

/* ================= 胶片处理 ================= */
function applyStock(d, st){
    const lut = stockLut(st);
    const n = d.length;
    const sat = st.sat == null ? 1 : st.sat;
    const bw = !!st.bw;
    const bwMix = st.bwMix || [0.3, 0.59, 0.11];
    const m = st.matrix;
    const hal = st.halation;
    let hd = null, thr = 0, span = 1, cr = 0, cg = 0, cb = 0;

    if (hal && hal.amount > 0){
        if (haloCv.width !== PIX_W 
|| haloCv.height !== PIX_H){
            haloCv.width = PIX_W;
            haloCv.height = PIX_H;
            haloImg = null;
        }
        if (!haloImg || haloImg.width !== PIX_W || haloImg.height !== PIX_H){
            haloImg = haloCtx.createImageData(PIX_W, PIX_H);
        }
        hd = haloImg.data;
        hd.fill(0);
        thr = hal.threshold * 255;
        span = Math.max(1, 255 - thr);
        cr = hal.color[0]; cg = hal.color[1]; cb = 
hal.color[2];
    }

    for (let i = 0; i < n; i += 4){
        let r = lut[d[i]], g = lut[256 + d[i+1]], b = lut[512 + d[i+2]];
        let l;
        if (m){
            const nr = m[0] * r + m[1] * g + m[2] * b;
            const ng = m[3] * r + m[4] * g + m[5] * b;
            const nb = m[6] * r + m[7] * g + m[8] * b;
            r = nr; g = ng; b = nb;
        }
        if (bw){
            l = r * bwMix[0] + g * bwMix[1] + b * 
bwMix[2];
            d[i] = d[i+1] = d[i+2] = l;
        } else {
            l = r * 0.2126 + g * 0.7152 + b * 0.0722;
            d[i]   = l + (r - l) * sat;
            d[i+1] = l + (g - l) * sat;
            d[i+2] = l + (b - l) * sat;
        }
        if (hd){
            let v = ((d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114) - thr) / span;
            if (v > 0){
                if (v > 1) v = 1;
                v *= v;
                hd[i] = cr * v;
                hd[i+1] = cg * v;
                hd[i+2] = cb * 
v;
                hd[i+3] = 255;
            }
        }
    }

    if (hd){
        haloCtx.putImageData(haloImg, 0, 0);
        // 缩到 1/8 再放大回去：一次大半径柔化，得到胶片那种宽而软的溢光
        const bw2 = Math.max(1, PIX_W >> 3);
        const bh2 = Math.max(1, PIX_H >> 3);
        if (haloBlurCv.width !== bw2 || haloBlurCv.height !== 
bh2){
            haloBlurCv.width = bw2;
            haloBlurCv.height = bh2;
        }
        haloBlurCtx.imageSmoothingEnabled = true;
        haloBlurCtx.clearRect(0, 0, bw2, bh2);
        haloBlurCtx.drawImage(haloCv, 0, 0, bw2, bh2);

        // 再缩一档，做一层更宽的尾晕；两层叠起来才是乳剂散射的衰减
        const bw3 = Math.max(1, PIX_W >> 5);
        const bh3 = Math.max(1, 
PIX_H >> 5);
        if (haloWideCv.width !== bw3 || haloWideCv.height !== bh3){
            haloWideCv.width = bw3;
            haloWideCv.height = bh3;
        }
        haloWideCtx.imageSmoothingEnabled = true;
        haloWideCtx.clearRect(0, 0, bw3, bh3);
        haloWideCtx.drawImage(haloCv, 0, 0, bw3, bh3);

        haloOn = true;
    } else {
        haloOn = 
false;
    }
}

function makeDrumItem(f, i, ghost){

'translateY(' + (-stockIndex * DRUM_H) + 'px)';

function selectStock(i, silent){
    const ni = clamp(Math.round(i), 0, STOCKS.length - 1);
    const changed = ni !== stockIndex;
    stockIndex = ni;
    stockNum.textContent = (ni + 1) + '/' + STOCKS.length;
    layoutDrum(true);
    needsPixel = true;
    if (changed && !silent){
        haptic(7);
        toast(STOCKS[ni].label, 
1400);
    }
}

let drumDrag = null;
let drumMoved = false;

drumEl.addEventListener('pointerdown', function(e){
    e.preventDefault();
    try { drumEl.setPointerCapture(e.pointerId); } catch(err){}
    drumDrag = { y0:e.clientY, i0:stockIndex, hover:stockIndex };
    drumMoved = false;
    drumTrack.style.transition = 
'none';
});

drumEl.addEventListener('pointermove', function(e){
    if (!drumDrag) return;
    const dy = e.clientY - drumDrag.y0;
    if (Math.abs(dy) > 6) drumMoved = true;

    // 限位 + 阻尼
    let off = (-drumDrag.i0 * DRUM_H) + dy;
    const minY = -(STOCKS.length - 1) * DRUM_H;
    if (off > 0) off = off * 0.35;
    if (off < minY) off = minY + (off - minY) * 
0.35;
    drumTrack.style.transform = 'translateY(' + off + 'px)';

    const hover = clamp(Math.round(-off / DRUM_H), 0, STOCKS.length - 1);
    if (hover !== drumDrag.hover){
        drumDrag.hover = hover;
        haptic(3);
        highlightDrum(hover);
        stockNum.textContent = (hover + 1) + '/' + STOCKS.length;
    }
});

function endDrumDrag(e){
    if (!drumDrag) 
return;
    // pointercancel 时 clientY 不可信，直接停在当前高亮档
    const idx = (e.type === 'pointercancel')
        ? drumDrag.hover
        : clamp(Math.round(drumDrag.i0 - (e.clientY - drumDrag.y0) / DRUM_H), 0, STOCKS.length - 1);
    drumDrag = null;
    selectStock(idx);
    setTimeout(function(){ drumMoved = false; }, 80);
}
drumEl.addEventListener('pointerup', endDrumDrag);
drumEl.addEventListener('pointercancel', 
endDrumDrag);

drumEl.addEventListener('click', function(e){
    const it = e.target.closest('.drum-item');
    if (!it || drumMoved) return;

-1));

/* ================= 变焦摇杆 ================= */
function updateZoomUI(){
    zoomVal.textContent = zoom.toFixed(1) + '×';
    osdZoom.textContent = (zoom <= 1.001 ? 'W ' : 'T ') + zoom.toFixed(1) + 'x';
}

function setZoom(v, fromGesture){
    const nz = clamp(Math.round(v * 100) / 100, ZOOM_MIN, ZOOM_MAX);
    if (!fromGesture && 
Math.abs(nz - zoom) < 0.001) return;
    zoom = nz;
    if (zoom <= 1.001){ panX = 0; panY = 0; }
    needsPixel = true;
    updateZoomUI();
}

function zoomStep(dir){
    setZoom(zoom + dir * 0.1, true);
}

function rockDown(e){
    const btn = e.currentTarget;

e.preventDefault();

    haptic(8);

    zoomRocker.classList.remove('tilt-t', 'tilt-w');

zoomRocker.querySelectorAll('.rock-half');

}

h.addEventListener('pointercancel', rockUp);

/* ================= 取景器手势 ================= */
const pointers = new Map();
let drag = null, pinch = null;

lcdInner.addEventListener('pointerdown', function(e){
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    try { lcdInner.setPointerCapture(e.pointerId); } catch(err){}
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if (pointers.size === 1){
        drag = { x:e.clientX, y:e.clientY, px:panX, py:panY };
        pinch = null;
    } else if (pointers.size === 2){
        const pts = Array.from(pointers.values());
        pinch = { d: Math.hypot(pts[0].x - pts[1].x, 
pts[0].y - pts[1].y) || 1, z: zoom };
        drag = null;
    }
});

lcdInner.addEventListener('pointermove', function(e){
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if (pinch && pointers.size >= 2){
        const pts = Array.from(pointers.values());
        const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 
1;
        setZoom(pinch.z * (d / pinch.d), true);
    } else if (drag && pointers.size === 1){
        const dx = e.clientX - drag.x;
        const dy = e.clientY - drag.y;
        if (zoom > 1.001){
            const rect = lcdInner.getBoundingClientRect();
            const rx = Math.max(1, rect.width * (1 - 1 / zoom));
            const ry = Math.max(1, rect.height * (1 - 1 / zoom));
            panX = clamp(drag.px + (dx / rx) * 2, -1, 1);
            panY = clamp(drag.py + (dy / ry) * 2, -1, 
1);
            needsPixel = true;
        }
    }
});

function endPointer(e){
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);

    if (pointers.size === 0){
        drag = null;
        pinch = null;
    } else if (pointers.size === 1){
        const p = Array.from(pointers.values())[0];
        drag = { x:p.x, y:p.y, px:panX, py:panY 
};
        pinch = null;
    }
}
lcdInner.addEventListener('pointerup', endPointer);
lcdInner.addEventListener('pointercancel', endPointer);

/* ================= 渲染 ================= */
function getSource(){
    if (mode === 'camera' && videoReady && video.videoWidth){
        return { el: video, w: video.videoWidth, h: video.videoHeight };
    
}
    if (mode === 'photo' && sourceImage){
        return { el: sourceImage, w: sourceImage.naturalWidth, h: sourceImage.naturalHeight };
    }
    return null;
}

function renderPixel(){
    const src = getSource();
    if (!src || !src.w || !src.h) return false;

    const base = Math.max(PIX_W / src.w, PIX_H / src.h);
    const dw = src.w * base * 
zoom;
    const dh = src.h * base * zoom;
    const maxDX = Math.max(0, dw - PIX_W);
    const maxDY = Math.max(0, dh - PIX_H);

    let dx = -maxDX / 2 + (panX * maxDX) / 2;
    let dy = -maxDY / 2 + (panY * maxDY) / 2;
    dx = clamp(dx, -maxDX, 0);
    dy = clamp(dy, -maxDY, 0);

    const mirrored = (mode === 'camera' && facing === 'user');

    
pixelCtx.imageSmoothingEnabled = true;
    pixelCtx.imageSmoothingQuality = 'high';
    pixelCtx.save();
    if (mirrored){
        pixelCtx.translate(PIX_W, 0);
        pixelCtx.scale(-1, 1);
    }
    pixelCtx.clearRect(0, 0, PIX_W, PIX_H);
    pixelCtx.drawImage(src.el, dx, dy, dw, dh);
    pixelCtx.restore();

    const st = STOCKS[stockIndex];
    if (st.key !== 'none'){
        const img = 
pixelCtx.getImageData(0, 0, PIX_W, PIX_H);
        applyStock(img.data, st);
        pixelCtx.putImageData(img, 0, 0);
    } else {
        haloOn = false;
    }
    return true;
}

/* ================= 成品合成 ================= */
/* 颗粒：两层不同尺度的彩色噪点，围绕中灰用 overlay 混合。
   这样是“调制亮度”的胶片颗粒，而不是把灰噪点直接盖在画面上。 */
function makeGrainTile(size, 
block){
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    const img = g.createImageData(size, size);
    const d = img.data;
    for (let y = 0; y < size; y += block){
        for (let x = 0; x < size; x += block){
            const lum = ((Math.random() + Math.random() + Math.random()) / 3 - 0.5) * 2;
            const r = clamp(128 + lum * 86 + (Math.random() - 0.5) * 
34, 0, 255);
            const gg = clamp(128 + lum * 86 + (Math.random() - 0.5) * 34, 0, 255);
            const bb = clamp(128 + lum * 86 + (Math.random() - 0.5) * 34, 0, 255);
            for (let yy = 0; yy < block; yy++){
                for (let xx = 0; xx < block; xx++){
                    const i = ((y + yy) * size + (x + xx)) * 4;
                    d[i] = r; d[i+1] = gg; d[i+2] = bb; d[i+3] = 255;
                }
            }
        }
    
}
    g.putImageData(img, 0, 0);
    return c;
}
const grainFineTile = makeGrainTile(256, 1);
const grainCoarseTile = makeGrainTile(128, 2);

const cacheMap = new WeakMap();
function cachesFor(ctx){
    let m = cacheMap.get(ctx);
    if (!m){ m = { vig:new Map(), scan:new Map(), grainFine:null, grainCoarse:null }; cacheMap.set(ctx, m); }
    return m;
}

function vignetteFor(ctx, W, H){
    const c = cachesFor(ctx);
    const k = W + 'x' + H;
    let g = c.vig.get(k);
    if (!g){
        g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.30, W/2, H/2, Math.hypot(W,H)*0.60);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(0.68, 'rgba(0,0,0,0.10)');
        g.addColorStop(1, 'rgba(0,0,0,0.46)');
        c.vig.set(k, g);
    
}
    return g;
}

function scanPatternFor(ctx, H){
    const c = cachesFor(ctx);
    const step = clamp(Math.round(H / 200), 2, 4);
    const k = 'scan' + step;
    let p = c.scan.get(k);
    if (!p){
        const tile = document.createElement('canvas');
        tile.width = 4; tile.height = step;
        const t = 
tile.getContext('2d');
        t.fillStyle = 'rgba(0,0,0,0.30)';
        t.fillRect(0, step - 1, 4, 1);
        p = ctx.createPattern(tile, 'repeat');
        c.scan.set(k, p);
    }
    return p;
}

function grainFinePatternFor(ctx){
    const c = cachesFor(ctx);
    if (!c.grainFine) c.grainFine = ctx.createPattern(grainFineTile, 'repeat');
    return c.grainFine;
}

function grainCoarsePatternFor(ctx){
    const c = cachesFor(ctx);
    if (!c.grainCoarse) c.grainCoarse = ctx.createPattern(grainCoarseTile, 'repeat');
    return c.grainCoarse;
}

function drawStamp(ctx, W, H){
    const size = Math.max(11, Math.round(H * 0.046));
    const pad = Math.round(W * 0.028);
    ctx.save();
    ctx.font = '700 ' + size + 'px "Courier New", Courier, 
monospace';
    ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = size * 0.42;
    ctx.fillStyle = 'rgba(255,214,140,0.94)';
    ctx.fillText(dateStamp(), pad, H - pad);
    ctx.restore();
}

function compose(ctx, W, H){
    const st = STOCKS[stockIndex];

    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(pixelCv, 0, 0, W, 
H);

    // 光晕：高光在胶片乳剂层里散射。大半径那层做整体氛围，小半径那层贴着高光边缘
    if (haloOn && st.halation && st.halation.amount > 0){
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.imageSmoothingEnabled = true;
        ctx.globalAlpha = st.halation.amount * 0.5;
        ctx.drawImage(haloWideCv, 0, 0, W, H);
        ctx.globalAlpha = 
st.halation.amount;
        ctx.drawImage(haloBlurCv, 0, 0, W, H);
        ctx.restore();
    }

    if (crtOn){
        ctx.fillStyle = vignetteFor(ctx, W, H);
        ctx.fillRect(0, 0, W, H);
    }

    drawStamp(ctx, W, H);

    if (crtOn){
        ctx.fillStyle = scanPatternFor(ctx, H);
        ctx.fillRect(0, 0, W, H);
    
}

    // 颗粒：细颗粒贴着像素、粗颗粒成团，两层都用 overlay 调制原有亮度。
    // CRT 自带一点底噪，胶片按自己的强度往上加；关掉 CRT 时胶片颗粒仍在。
    const gs = st.grain || 0;
    const coarseA = Math.min(0.45, (crtOn ? 0.08 : 0) + gs * 0.20);
    const fineA = Math.min(0.50, (crtOn ? 0.16 : 0) + gs * 0.26);
    if (coarseA > 0.005 || fineA > 0.005){
        ctx.save();
        ctx.globalCompositeOperation 
= 'overlay';
        if (coarseA > 0.005){
            ctx.globalAlpha = coarseA;
            ctx.translate(-((Math.random()*128)|0), -((Math.random()*128)|0));
            ctx.fillStyle = grainCoarsePatternFor(ctx);
            ctx.fillRect(0, 0, W + 128, H + 128);
        }
        if (fineA > 0.005){
            ctx.globalAlpha = fineA;
            ctx.translate(-((Math.random()*256)|0), -((Math.random()*256)|0));
            ctx.fillStyle = 
grainFinePatternFor(ctx);
            ctx.fillRect(0, 0, W + 256, H + 256);
        }
        ctx.restore();
    }
}

/* ================= 主循环 ================= */
function tick(){
    requestAnimationFrame(tick);

    const live = (mode === 'camera' && videoReady);
    const redraw = live || needsPixel;
    if (redraw){
        if (renderPixel()) 
hasFrame = true;
        needsPixel = false;
    }
    if (!hasFrame) return;

    // 照片模式是静止画面：只在画面真的变了才重绘取景器，省电
    if (redraw || previewDirty){
        if (screenCv.width) compose(screenCtx, screenCv.width, screenCv.height);
        previewDirty = false;
    }
    if (recording) compose(recCtx, recCv.width, recCv.height);
}

/* ================= 摄像头 
================= */
function setEmpty(kind, msg, showActions){
    emptyBox.hidden = false;
    emptyBox.classList.toggle('loading', kind === 'loading');
    emptyMsg.textContent = msg;
    emptyActions.hidden = !showActions;
}
function hideEmpty(){ emptyBox.hidden = true; }

function stopStream(){
    if (stream){
        stream.getTracks().forEach(function(t){ t.stop(); 
});
        stream = null;
    }
}

function cameraErrorText(err){
    if (location.protocol === 'file:'){
        return '当前是本地文件（file://）方式打开，浏览器不允许使用摄像头。请用本地服务器打开本页。';
    }
    if (window.isSecureContext === false){
        return '当前页面不是安全上下文。浏览器只允许在 https 或 localhost 下调用摄像头。';
    }
    const name = err && 
err.name;
    if (name === 'NotAllowedError' || name === 'SecurityError'){
        return '摄像头权限被拒绝了。点地址栏左侧的锁 / 摄像机图标 → 摄像头 → 允许，再刷新页面。也可以在浏览器设置的「网站权限 → 摄像头」里把 localhost 改成允许。';
    }
    if (name === 'NotFoundError' || name === 'DevicesNotFoundError'){
        return '没有检测到摄像头设备。';
    }
    if (name === 'NotReadableError' || name 
=== 'TrackStartError'){
        return '摄像头被其他程序占用或系统禁止访问。';
    }
    if (name === 'OverconstrainedError'){
        return '摄像头不支持所请求的画面参数。';
    }
    return '摄像头无法启动：' + (err && err.message ? err.message : '未知错误');
}

async function refreshCameras(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) 
return;
    try{
        const list = await navigator.mediaDevices.enumerateDevices();
        cameras = list.filter(function(d){ return d.kind === 'videoinput' && d.deviceId; });
    } catch(e){
        cameras = [];
    }
}

async function openStream(constraints){
    try{
        return await 
navigator.mediaDevices.getUserMedia(constraints);
    } catch(err){
        // 刚停掉上一个摄像头时，部分手机/浏览器会短暂报占用，等一拍再试
        if (err && (err.name === 'NotReadableError' || err.name === 'AbortError')){
            await new Promise(function(r){ setTimeout(r, 300); });
            return await navigator.mediaDevices.getUserMedia(constraints);
        }
        throw err;
    }
}

async function startCamera(opts){
    opts = opts || {};
    const wantFacing = opts.facingMode || facing;
    const wantDevice = opts.deviceId || '';

    stopStream();
    videoReady = false;
    hasFrame = false;
    setEmpty('loading', '正在开启摄像头…', false);

    if (!navigator.mediaDevices || 
!navigator.mediaDevices.getUserMedia){
        let msg;
        if (location.protocol === 'file:'){
            msg = '本地文件（file://）方式打开时浏览器禁止使用摄像头。请用本地服务器打开本页。';
        } else if (window.isSecureContext === false){
            msg = '需要通过 https 或 localhost 访问才能调用摄像头。';
        } else {
            msg = '当前浏览器不支持摄像头。';
        }
        setEmpty('error', msg, true);
        
return;
    }

    // 采样分辨率高一点，最大变焦裁切后仍有足够细节喂给 384×288 的像素画布
    const size = { width: { ideal: 1920 }, height: { ideal: 1440 } };
    try{
        try{
            const c = wantDevice
                ? Object.assign({ deviceId: { exact: wantDevice } }, size)
                : Object.assign({ facingMode: { ideal: wantFacing } }, size);
            stream = await openStream({ video: c, audio: 
false });
        }catch(e1){
            if (e1 && (e1.name === 'OverconstrainedError' || e1.name === 'ConstraintNotSatisfiedError')){
                stream = await openStream({ video: true, audio: false });
            } else if (wantDevice){
                // 设备 ID 可能已失效（相机被拔出、权限变化），退回 facingMode
                stream = await openStream({
                    video: Object.assign({ facingMode: { ideal: wantFacing } }, size),
                    audio: 
false
                });
            } else {
                throw e1;
            }
        }
        video.srcObject = stream;
        try { await video.play(); } catch(playErr){}

        // 以轨道的真实参数为准，不然 UI 会以为切了而实际没切
        try{
            const track = stream.getVideoTracks()[0];
            const s = track && track.getSettings ? track.getSettings() : {};
            if (s.deviceId) 
currentDeviceId = s.deviceId;
            if (s.facingMode === 'user' || s.facingMode === 'environment') facing = s.facingMode;
        }catch(e){}

        await refreshCameras();

        videoReady = true;
        mode = 'camera';
        sourceImage = null;
        zoom = 1; panX = 0; panY = 0;
        updateZoomUI();
        updateModeUI();
        hideEmpty();
        needsPixel = true;
    } 
catch(err){
        console.warn('[DV-301] camera error:', err);
        setEmpty('error', cameraErrorText(err), true);
    }
}

async function flipCamera(){
    if (mode === 'photo'){
        if (videoReady){
            mode = 'camera';
            sourceImage = null;
            hasFrame = false;
            hideEmpty();
            updateModeUI();
            toast('已回到实时画面');
        } else {
            await 
startCamera();
        }
        return;
    }
    if (recording){ toast('录像中无法切换'); return; }

    await refreshCameras();

    // 有多个设备就按 deviceId 轮换：facingMode 在不少浏览器里只是“建议”，会被忽略
    if (cameras.length > 1){
        let idx = -1;
        for (let i = 0; i < cameras.length; i++){
            if (cameras[i].deviceId === currentDeviceId){ idx = i; break; 
}
        }
        const next = cameras[(idx + 1) % cameras.length];
        await startCamera({ deviceId: next.deviceId });
        if (videoReady) toast(next.label || ('摄像头 ' + (idx + 2)));
        return;
    }

    // 只有一个（或还没拿到设备列表）：退回 facingMode 切换
    facing = (facing === 'environment') ? 'user' : 'environment';
    await startCamera({ facingMode: facing 
});
    if (videoReady) toast(cameras.length === 1 ? '只有一个摄像头' : (facing === 'user' ? '前置摄像头' : '后置摄像头'));
}

    osdMode.textContent = photo ? 'PHOTO' : 'CAM';

}

/* ================= 上传 
================= */
function pickFile(){ fileInput.click(); }
uploadBtn.addEventListener('click', pickFile);
$('emptyUploadBtn').addEventListener('click', pickFile);
$('retryBtn').addEventListener('click', function(){ startCamera(); });

fileInput.addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    fileInput.value = '';
    if (!f) return;
    const url = 
URL.createObjectURL(f);
    const img = new Image();
    img.decoding = 'async';
    img.onload = function(){
        URL.revokeObjectURL(url);
        switchToPhoto(img);
    };
    img.onerror = function(){
        URL.revokeObjectURL(url);
        toast('无法读取这张图片');
    };
    img.src = url;
});

function switchToPhoto(img){
    sourceImage = img;
    mode = 'photo';
    zoom = 1; panX = 0; panY = 0;
    
updateZoomUI();
    updateModeUI();
    hideEmpty();
    needsPixel = true;
    toast('已载入照片 · 可缩放平移');
}

/* ================= 拍照 ================= */
function flashScreen(){
    flashEl.classList.remove('go');
    void flashEl.offsetWidth;
    flashEl.classList.add('go');
}

function shutter(){
    if (!hasFrame){ toast('画面还没准备好'); return; }

    const W = EXPORT_W;
    const H = Math.round(EXPORT_W * PIX_H / PIX_W);
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    compose(c.getContext('2d'), W, H);

    flashScreen();
    haptic(16);

    c.toBlob(function(blob){
        if (!blob){ toast('保存失败'); return; }
        const name = 'DV301_' + 
fileStamp() + '.png';
        download(blob, name);
        toast('已保存照片');
    }, 'image/png');
}

shutterBtn.addEventListener('click', shutter);

/* ================= 下载 ================= */
function download(blob, name){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.style.display = 
'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
        a.remove();
        URL.revokeObjectURL(url);
    }, 10000);
}

/* ================= 录像 ================= */
function pickMimes(){
    const list = [
        'video/mp4;codecs=avc1.42E01E',
        'video/mp4',
        
'video/webm;codecs=vp9',
        'video/webm;codecs=vp8',
        'video/webm'
    ];
    if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return [''];
    return list.filter(function(m){
        try { return MediaRecorder.isTypeSupported(m); } catch(e){ return false; }
    }).concat(['']);
}

function micWithTimeout(ms){
    const req = navigator.mediaDevices.getUserMedia({ audio: true 
});
    let late = false;
    const guard = new Promise(function(_, reject){
        setTimeout(function(){ late = true; reject(new Error('mic-timeout')); }, ms);
    });
    req.then(function(s){
        if (late) s.getTracks().forEach(function(t){ t.stop(); });
    }).catch(function(){});
    return Promise.race([req, guard]);
}

function releaseTracks(){
    if 
(capStream){
        capStream.getTracks().forEach(function(t){ t.stop(); });
        capStream = null;
    }
    if (auxAudio){
        auxAudio.getTracks().forEach(function(t){ t.stop(); });
        auxAudio = null;
    }
}

function buildRecorder(){
    // 分辨率越高给越多码率，否则 1536×1152 会被压得很脏
    const vbps = Math.min(14000000, 
Math.max(6000000, PIX_W * PIX_H * 110));
    const opts = { videoBitsPerSecond: vbps };
    const candidates = pickMimes();
    for (let i = 0; i < candidates.length; i++){
        const m = candidates[i];
        const o = Object.assign({}, opts);
        if (m) o.mimeType = m;
        try {
            return { rec: new MediaRecorder(capStream, o), mime: m };
        } catch(e){ /* 下一个 */ }
    }
    return 
null;
}

async function startRecording(){
    if (recording) return;
    if (!hasFrame){ toast('画面还没准备好'); return; }
    if (typeof MediaRecorder === 'undefined'){ toast('当前浏览器不支持录像'); return; }

    recBtn.disabled = true;
    recCap.textContent = '准备';

    // 最多等 1.2 秒拿麦克风，超时就先录无声画面，不让用户干等权限弹窗
    let audioStream = null;
    
try{
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
            audioStream = await micWithTimeout(1200);
        }
    } catch(e){ audioStream = null; }

    recCap.textContent = '录像';

    recCv.width = PIX_W * 4;
    recCv.height = PIX_H * 4;
    compose(recCtx, recCv.width, recCv.height);

    try { capStream = 
recCv.captureStream(30); }
    catch(e){ recBtn.disabled = false; toast('无法录制画面'); return; }

    if (audioStream){
        const tracks = audioStream.getAudioTracks();
        for (let i = 0; i < tracks.length; i++) capStream.addTrack(tracks[i]);
        auxAudio = audioStream;
    }

    const built = buildRecorder();
    if (!built){
        releaseTracks();
        recBtn.disabled = false;
        
toast('录像启动失败');
        return;
    }

    mediaRecorder = built.rec;
    recordMime = built.mime;
    recordedChunks = [];

    mediaRecorder.ondataavailable = function(e){
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = function(){ finishRecording(); };
    mediaRecorder.onerror = function(){
        
toast('录制出错，已停止');
        if (recording) stopRecording();
    };

    try { mediaRecorder.start(1000); }
    catch(e){
        releaseTracks();
        recBtn.disabled = false;
        toast('录像启动失败');
        return;
    }

    recording = true;
    recStartTs = Date.now();
    recBtn.disabled = false;
    recBtn.classList.add('on');
    recCap.textContent = 
'停止';
    osdRec.classList.add('on');
    lcdWrap.classList.add('rec');
    osdRecTime.textContent = '00:00';
    setLocked(true);
    haptic(20);

    clearInterval(recTimerId);
    recTimerId = setInterval(function(){
        const ms = Date.now() - recStartTs;
        const s = Math.floor(ms / 1000);
        osdRecTime.textContent = pad2(Math.floor(s / 60)) + ':' + pad2(s % 60);
        if (ms >= 
MAX_REC_MS){
            toast('已达单段 60 秒上限');
            stopRecording();
        }
    }, 250);
}

function stopRecording(){
    if (!recording) return;
    recording = false;
    clearInterval(recTimerId);

    recBtn.classList.remove('on');
    recCap.textContent = '录像';
    osdRec.classList.remove('on');
    lcdWrap.classList.remove('rec');
    setLocked(false);

    if (mediaRecorder && mediaRecorder.state !== 'inactive'){
        try { mediaRecorder.stop(); } catch(e){ try { finishRecording(); } catch(e2){} }
    } else {
        finishRecording();
    }
}

function finishRecording(){
    const blob = new Blob(recordedChunks, { type: recordMime || 'video/webm' });
    recordedChunks = [];

    
releaseTracks();
    mediaRecorder = null;

    if (blob.size > 0){
        const ext = (recordMime.indexOf('mp4') >= 0) ? 'mp4' : 'webm';
        const name = 'DV301_' + fileStamp() + '.' + ext;
        download(blob, name);
        toast('已保存录像');
    } else {
        toast('录像内容为空');
    }
}

recBtn.addEventListener('click', function(){
    if (!recording) 
startRecording();
    else stopRecording();
});

function setLocked(locked){
    [flipBtn, pixBtn, uploadBtn].forEach(function(b){ b.disabled = locked; });
}

/* ================= 键盘 ================= */
window.addEventListener('keydown', function(e){
    if (e.target && e.target.closest && e.target.closest('button, input, textarea')) return;
    if (e.code === 'Space'){
        
e.preventDefault();
        shutter();
    } else if (e.key === 'r' || e.key === 'R'){
        if (recording) stopRecording(); else startRecording();
    } else if (e.key === 'ArrowUp'){
        e.preventDefault();
        setZoom(zoom + ZOOM_STEP);
    } else if (e.key === 'ArrowDown'){
        e.preventDefault();
        setZoom(zoom - ZOOM_STEP);
    } else if (e.key === 'ArrowLeft'){
        
e.preventDefault();
        selectStock(stockIndex - 1);
    } else if (e.key === 'ArrowRight'){
        e.preventDefault();
        selectStock(stockIndex + 1);
    }
});

document.addEventListener('visibilitychange', function(){
    if (document.hidden && recording){
        stopRecording();
        toast('已切到后台，录像自动停止');
    }
});

/* ================= CRT / 像素档位 ================= */
crtBtn.addEventListener('click', function(){
    crtOn = !crtOn;
    crtBtn.setAttribute('aria-checked', crtOn ? 'true' : 'false');
    previewDirty = true;
    haptic(9);
});

function setPixelLevel(i){
    pixIndex = (i + PIX_LEVELS.length) % PIX_LEVELS.length;
    const lv = PIX_LEVELS[pixIndex];
    PIX_W = lv.w; PIX_H = 
lv.h;
    pixelCv.width = PIX_W;
    pixelCv.height = PIX_H;
    recCv.width = PIX_W * 4;
    recCv.height = PIX_H * 4;
    pixLabel.textContent = lv.name;
    needsPixel = true;
    toast('像素 ' + lv.name + ' · ' + lv.w + '×' + lv.h, 1200);
}

pixBtn.addEventListener('click', function(){
    if (recording){ toast('录像中无法更换画质'); return; }
    setPixelLevel(pixIndex + 1);
});

/* ================= 启动 ================= */
sizeScreen();
stockNum.textContent = '1/' + STOCKS.length;
layoutDrum(false);
updateZoomUI();
updateModeUI();
requestAnimationFrame(tick);
startCamera();

setTimeout(function(){
    if (hasFrame) toast('按住 T / W 连续变焦 · 拨动滚轮换胶片', 2600);
}, 1600);

})();
</script>
</body>
</html>
